{% extends 'sneaker_app/base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-8 col-lg-6">
        <div class="card card-app shadow-lg">
            <div class="card-header bg-dark text-white"><h5 class="mb-0"><i class="fa-solid fa-clipboard-list me-2 text-warning"></i>{{ action }}</h5></div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data" class="form-app">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small mb-1">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text text-muted" style="font-size: 0.75rem;">{{ field.help_text|safe }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <small class="text-danger d-block"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ error }}</small>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-accent px-4 flex-grow-1"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกข้อมูล</button>
                        <a href="{% url cancel_url %}" class="btn btn-outline-secondary btn-pill-modern px-4"><i class="fa-solid fa-xmark me-1"></i>ยกเลิก</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.form-app input, .form-app select, .form-app textarea').forEach(el => {
        if(el.type !== 'submit' && el.type !== 'file') el.classList.add('form-control');
    });
    document.querySelectorAll('.form-app input[type="file"]').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
