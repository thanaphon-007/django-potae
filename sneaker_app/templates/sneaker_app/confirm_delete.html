{% extends 'sneaker_app/base.html' %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-app shadow-lg text-center border-0">
            <div class="card-body p-5">
                <span class="stat-icon bg-danger-subtle text-danger mx-auto" style="width: 84px; height: 84px; border-radius: 24px; font-size: 2.4rem;"><i class="fa-solid fa-triangle-exclamation"></i></span>
                <h3 class="fw-bold text-dark mt-4">ยืนยันการลบข้อมูล</h3>
                <p class="text-muted mb-1">คุณต้องการลบ <strong>{{ item_name }}</strong> ใช่หรือไม่?</p>
                <small class="text-danger">การลบไม่สามารถย้อนกลับได้</small>
                <form method="POST" class="d-flex gap-2 mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-pill-modern px-4 flex-grow-1"><i class="fa-solid fa-trash me-1"></i>ยืนยันการลบ</button>
                    <a href="{% url cancel_url %}" class="btn btn-outline-secondary btn-pill-modern px-4"><i class="fa-solid fa-xmark me-1"></i>ยกเลิก</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
